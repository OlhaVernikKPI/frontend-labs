<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">

    <meta
        name="keywords"
        content="HTML5, CSS3, таблиці, position, transform, frontend, Вернік Ольга"
    >

    <meta
        name="description"
        content="Лабораторна робота №2 з дисципліни Основи FE-технологій"
    >

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Вернік О.О. | IC-42 | ЛР №2 | Варіант 2</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1>Лабораторна робота №2</h1>

        <h2>Завдання 1. Таблиця HTML5</h2>

        <table class="variant-table">

            <tbody class="name-block">

                <tr>
                    <td rowspan="3" class="main-cell">
                        Вернік
                    </td>

                    <td>
                        Ольга
                    </td>

                    <td rowspan="3" class="main-cell">
                        Олексіївна
                    </td>

                    <td></td>
                </tr>

                <tr>
                    <td></td>
                    <td></td>
                </tr>

                <tr>
                    <td></td>
                    <td></td>
                </tr>

            </tbody>

            <tbody class="info-block">

                <tr>
                    <td> IC-42</td>

                    <td colspan="2">
                        ЛР №2
                    </td>

                    <td>
                        Варіант 2
                    </td>
                </tr>

            </tbody>

        </table>


        <h2>Завдання 2. Зображення засобами CSS</h2>

        <div class="figures">

            <section class="figure-item">

                <h3>За допомогою position</h3>

                <div class="cross-position">

                    <div class="position-horizontal"></div>

                    <div class="position-vertical"></div>

                </div>

            </section>


            <section class="figure-item">

                <h3>За допомогою transform</h3>

                <div class="cross-transform">

                    <div class="transform-bar"></div>

                    <div class="transform-bar vertical-transform"></div>

                </div>

            </section>

        </div>

    </main>

</body>

</html>
